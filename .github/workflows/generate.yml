name: Generate

# Writes today's issue on a schedule, billed to your Claude SUBSCRIPTION (no API key, no PC needed).
# Kept short and bounded because headless OAuth tokens don't refresh mid-run (see CLOUD_SETUP.md).
on:
  schedule:
    # 20:00 UTC = 6:00am AEST (Sydney). Adjust to taste.
    - cron: "0 20 * * *"
    # Catch-up: GitHub silently drops scheduled runs under load. A second attempt ~45min later
    # re-authors only if today's issue is still missing (the guard step below short-circuits otherwise).
    - cron: "45 21 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

# Shares the "pages" group with deploy.yml so this run's deploy never collides with a
# browser-sync-triggered deploy (Pages rejects concurrent deployments outright).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    # Backstop only — the two Claude steps are bounded individually below so a slow one still
    # reaches Build + Commit (a job-level timeout would cancel those and commit nothing).
    # 30 = research (9) + author (12) + the deterministic steps, with room to spare.
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"

      # 0a. Materialise the reader's private STATE (reading-state, knowledge, corpus) from the
      #     cortex-state repo — they are no longer in this public checkout. Load-bearing: authoring
      #     personalisation and register-concepts read these, so a missing key HARD-FAILS the run
      #     (authoring blind would silently unpersonalise, and the knowledge push-back could clobber).
      #     Runs BEFORE the guard because the backlog check below reads reading-state.json.
      - name: Fetch private state (cortex-state)
        env:
          STATE_DEPLOY_KEY: ${{ secrets.STATE_DEPLOY_KEY }}
        run: |
          if [ -z "$STATE_DEPLOY_KEY" ]; then echo "STATE_DEPLOY_KEY secret not set — see CLOUD_SETUP.md"; exit 1; fi
          mkdir -p ~/.ssh
          printf '%s\n' "$STATE_DEPLOY_KEY" > ~/.ssh/cortex_state
          chmod 600 ~/.ssh/cortex_state
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          GIT_SSH_COMMAND="ssh -i ~/.ssh/cortex_state -o IdentitiesOnly=yes" \
            git clone --quiet git@github.com:t-reyn/cortex-state.git "$RUNNER_TEMP/cortex-state"
          cp "$RUNNER_TEMP/cortex-state"/data/*.json data/
          echo "state materialised from cortex-state"

      # 0b. Guard. Two independent reasons to skip, both cheap and deterministic:
      #     (1) today's issue already exists — makes the second (catch-up) cron a no-op;
      #     (2) the reader is behind — see scripts/lib/backlog.mjs. Measured 2026-08-09: 22 of 70
      #         articles read, 11 expired unread, last read a week earlier. Writing daily into a
      #         backlog nobody clears burns ~6.2M tokens a day to grow the pile, so the run now
      #         pauses when 3 of the last 5 issues are still unread and resumes by itself once
      #         they're read. Tunable via config.json -> backlog.{window,threshold}.
      #     workflow_dispatch always forces a run, bypassing both.
      - name: Guard — skip if today's issue exists or the reader is behind
        id: guard
        run: |
          skip=false
          if [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            # Sydney date ONLY: issues are dated in AEST (the date step below pins the author to
            # it). Checking the UTC date too would false-positive at the 20:00/21:45 UTC crons,
            # where UTC is still "yesterday" and yesterday's issue of course exists.
            d="$(TZ=Australia/Sydney date +%F)"
            if ls articles/"$d"/*.html >/dev/null 2>&1; then
              echo "today's issue already exists ($d) — skipping"
              skip=true
            fi
            node scripts/backlog.mjs --github
            if [ "$skip" != "true" ] && grep -q '^backlog_skip=true$' "$GITHUB_OUTPUT"; then
              skip=true
            fi
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"
          echo "syd=$(TZ=Australia/Sydney date +%F)" >> "$GITHUB_OUTPUT"

      # 0b. Fail fast before spending a Claude run if the build helpers regressed.
      - name: Unit tests
        if: steps.guard.outputs.skip != 'true'
        run: node --test scripts/lib/*.test.mjs

      # 1. Refresh the source pool from your feeds (deterministic, no LLM).
      - name: Ingest feeds
        if: steps.guard.outputs.skip != 'true'
        run: node scripts/ingest.mjs

      # 1b. Refresh live market datapoints (keyless grounding for time-sensitive pieces). Best-effort:
      #     a failure here must never abort the run, so it swallows its own errors.
      - name: Fetch live datapoints
        if: steps.guard.outputs.skip != 'true'
        run: node scripts/fetch-live.mjs || true

      # 2. Materialise the private reader profile from a secret. Gitignored (*.local.json) so it is
      #    NEVER committed. If the secret is unset, authoring falls back to generic (still works).
      - name: Write reader profile (from secret)
        if: steps.guard.outputs.skip != 'true'
        env:
          READER_PROFILE: ${{ secrets.READER_PROFILE }}
        run: |
          if [ -n "$READER_PROFILE" ]; then
            printf '%s' "$READER_PROFILE" > data/profile.local.json
            echo "reader profile materialised"
          else
            echo "no READER_PROFILE secret set — generic authoring"
          fi

      # 2b. Choose today's interest — deterministic, zero tokens. The cadence arithmetic used to be
      #     prose the author re-derived each morning from all ten tabs' digests; now it is code, and
      #     only the chosen tab (plus one fallback) reaches the model. Writes data/digest-today.json.
      #     Hard-fails if the pool digest is missing: researching against an empty menu means
      #     inventing a topic, which is the drift this pipeline exists to stop.
      - name: Pick today's interest
        id: pick
        if: steps.guard.outputs.skip != 'true'
        run: |
          node scripts/pick-interest.mjs --github
          # Snapshot the derived files the research step is forbidden to touch. They can't be restored
          # with `git checkout` — the ingest step above legitimately rewrote both, and reverting to
          # HEAD would throw that away along with anything the research step did.
          mkdir -p "$RUNNER_TEMP/pre-research"
          cp data/pool.json data/pool-digest.json data/quizbank.json "$RUNNER_TEMP/pre-research/"

      # 3. RESEARCH (Claude, networked). Picks the angle, reads the sources, writes ONE file:
      #    data/brief-today.md — resolved URLs, verbatim facts, quotes. This is the only step with
      #    WebFetch, so it is the only step that can be wrong about what a source says.
      - name: Research the brief (Claude, subscription)
        id: research
        if: steps.guard.outputs.skip != 'true'
        continue-on-error: true # a turn overrun is reported as step failure even when the brief was written
        timeout-minutes: 9 # each Claude step gets its own headless-token window; keep both well inside it
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: "Read skills/RESEARCH.md and data/digest-today.json, then research today's issue exactly as RESEARCH.md instructs. Today's issue date is ${{ steps.guard.outputs.syd }} (AEST); the interest is already chosen (picks[0]). Write exactly one file, data/brief-today.md, and stop. Do NOT create or edit anything under articles/, and do not touch data/knowledge.json, data/quizbank.json, data/pool.json or data/pool-digest.json."
          claude_args: "--max-turns 30 --model sonnet --allowedTools Read,Write,Edit,Glob,Grep,WebFetch"

      - name: Capture research usage
        if: always() && steps.guard.outputs.skip != 'true'
        run: |
          F="${{ steps.research.outputs.execution_file }}"
          [ -n "$F" ] && [ -f "$F" ] || F=$(find "$RUNNER_TEMP" -name 'claude-execution-output*.json' 2>/dev/null | xargs -r ls -t 2>/dev/null | head -1)
          if [ -n "$F" ] && [ -f "$F" ]; then cp "$F" "$RUNNER_TEMP/usage-research.json"; else echo "no execution output for research"; fi

      # 3a. Hold the research step to its contract. It is told not to write articles or state, but
      #     "told not to" is not a boundary — and a stray article here would be published unedited
      #     by the Build step below. pool.json/pool-digest.json come back from the post-ingest
      #     snapshot (NOT git — ingest rewrote them legitimately this run), and the private state
      #     files come back from the cortex-state clone they were materialised from.
      - name: Enforce research boundaries
        if: steps.guard.outputs.skip != 'true'
        run: |
          d="${{ steps.guard.outputs.syd }}"
          # Key on what CHANGED, never on the folder existing. workflow_dispatch bypasses the guard's
          # "today's issue already exists" check (line ~72), so on a manual run this folder routinely
          # holds an already-committed, already-published article — deleting it would stage a
          # deletion that the Commit step pushes to main, and if the research step then failed to
          # produce a brief the author is skipped entirely and nothing replaces it.
          if [ -n "$(git status --porcelain "articles/$d" 2>/dev/null)" ]; then
            echo "! research step touched articles/$d — reverting (the author writes the article)"
            git checkout -- "articles/$d" 2>/dev/null || true   # undo edits to tracked articles
            git clean -fdxq "articles/$d" 2>/dev/null || true   # remove ones it created
          fi
          # git is the right restore source for articles/ ONLY — nothing earlier in the job rewrites
          # it. pool.json/pool-digest.json must come from the post-ingest snapshot instead, because
          # ingest legitimately rewrote both this run and HEAD is stale for them.
          cp "$RUNNER_TEMP/pre-research/"*.json data/
          cp "$RUNNER_TEMP/cortex-state"/data/*.json data/
          echo "articles + pool + private state restored to their pre-research contents"

      # 3b. No brief, no author run. The author is contractually unable to work without one (it has
      #     no network and must not invent sources), so skipping here saves a whole Claude step
      #     rather than spending it to produce nothing.
      - name: Check the brief
        id: brief
        if: steps.guard.outputs.skip != 'true'
        run: |
          if [ -s data/brief-today.md ] && head -c 400 data/brief-today.md | grep -q '<!--[[:space:]]*meta:'; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
            echo "brief: $(wc -w < data/brief-today.md) words"
            head -1 data/brief-today.md
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "! no usable data/brief-today.md — skipping the author step (no issue today)"
          fi

      # 3c. AUTHOR (Claude, OFFLINE). No WebFetch in --allowedTools: that is the enforcement behind
      #     AUTHORING.md's "work only from the brief". An author that cannot fetch cannot cite a
      #     source it never read, which is the failure the split is here to make impossible.
      - name: Author article (Claude, subscription)
        id: author
        if: steps.guard.outputs.skip != 'true' && steps.brief.outputs.ok == 'true'
        continue-on-error: true # a partial/over-budget authoring run should still commit what it wrote
        timeout-minutes: 12 # stop authoring under the headless-token window; the run continues to Build + Commit
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: "Read skills/AUTHORING.md and data/brief-today.md, then write today's issue exactly as AUTHORING.md instructs. It is ONE article, built only from the brief — you have no network, so never fetch and never invent a source, figure or URL. Today's issue date is ${{ steps.guard.outputs.syd }} (AEST) — put the article in that dated folder. Run the full Editor pass. Stop when the article, knowledge.json and quizbank.json are updated; do not touch data/pool.json."
          # Turns are split across the two steps (30 research + 35 author) rather than the single
          # 60-turn budget: the author no longer spends turns on fetching, and the editor pass is
          # where its budget should go.
          claude_args: "--max-turns 35 --model sonnet --allowedTools Read,Write,Edit,Glob,Grep"

      - name: Capture author usage
        if: always() && steps.guard.outputs.skip != 'true'
        run: |
          F="${{ steps.author.outputs.execution_file }}"
          if [ -z "$F" ] || [ ! -f "$F" ]; then
            # Timed-out steps leave the output unset. Fall back to the newest execution file that
            # isn't the one research already claimed — with two Claude steps, "newest" alone would
            # log the research run's tokens twice.
            F=""
            for c in $(find "$RUNNER_TEMP" -name 'claude-execution-output*.json' 2>/dev/null | xargs -r ls -t 2>/dev/null); do
              if [ ! -f "$RUNNER_TEMP/usage-research.json" ] || ! cmp -s "$c" "$RUNNER_TEMP/usage-research.json"; then F="$c"; break; fi
            done
          fi
          if [ -n "$F" ] && [ -f "$F" ]; then cp "$F" "$RUNNER_TEMP/usage-author.json"; else echo "no execution output for author"; fi

      # 3d. Record this run's tokens + cost estimate to data/usage-log.jsonl. Top-level fields are the
      #     run TOTALS (comparable with every earlier row); `phases` splits research vs author.
      - name: Record usage
        if: always() && steps.guard.outputs.skip != 'true'
        run: node scripts/record-usage.mjs research="$RUNNER_TEMP/usage-research.json" author="$RUNNER_TEMP/usage-author.json"

      # 3e. Register any taught/assumed concepts the author forgot to add to knowledge.json
      #      (additive only). Both first contract-v2 runs skipped this step, failing the morning
      #      health check — don't let it depend on author discipline.
      - name: Register concepts
        if: steps.guard.outputs.skip != 'true'
        run: node scripts/register-concepts.mjs

      # 3f. Quarantine unpublishable drafts. A timed-out author step can leave a half-written
      #     article (e.g. no #meta block); --strict would then fail the Build and discard the WHOLE
      #     issue, good articles included. Delete today's defective drafts so the rest publishes.
      - name: Quarantine defective drafts
        if: steps.guard.outputs.skip != 'true'
        run: |
          for d in "$(TZ=Australia/Sydney date +%F)" "$(date -u +%F)"; do
            [ -d "articles/$d" ] || continue
            for f in articles/"$d"/*.html; do
              [ -e "$f" ] || continue
              if ! node -e '
                const html = require("fs").readFileSync(process.argv[1], "utf8");
                const m = html.match(/<script[^>]*id="meta"[^>]*>([\s\S]*?)<\/script>/);
                if (!m) process.exit(1);
                const j = JSON.parse(m[1]);
                if (!j.id || !j.title || !j.interest) process.exit(1);
              ' "$f" 2>/dev/null; then
                echo "quarantining unpublishable draft: $f"
                rm -f "$f"
              fi
            done
          done

      # 3g. Retire the pool items the brief drew on (status -> "used"). Deliberately AFTER the
      #     quarantine step: it no-ops unless an article actually published today, so a research run
      #     whose author then died never burns its own candidates. continue-on-error because a
      #     bookkeeping problem must never cost an issue that is already written.
      - name: Consume pool items
        if: steps.guard.outputs.skip != 'true'
        continue-on-error: true
        run: node scripts/consume-pool.mjs --date=${{ steps.guard.outputs.syd }}

      # 4. Build the hub/feed/sitemap/manifest from the new articles.
      - name: Build
        if: steps.guard.outputs.skip != 'true'
        run: node scripts/generate-index.mjs --strict

      # 5. Persist generated content. `git add` is path-scoped and .gitignore protects the profile,
      #    so the secret-derived profile is never committed.
      - name: Commit
        if: steps.guard.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "reading-bot"
          git config user.email "noreply@users.noreply.github.com"
          # Tolerate optional artifacts (e.g. a digest that wasn't produced) — a missing pathspec
          # must never abort the commit and lose the issue.
          # knowledge.json is NOT in this list — it lives in the private cortex-state repo now and
          # is pushed there by the next step (state files are gitignored here since the 2026-07-18
          # privacy split, so an accidental add would be a no-op anyway).
          for f in articles data/pool.json data/pool-digest.json data/seen.json data/quizbank.json data/manifest.json data/usage-log.jsonl data/live.json data/feed-health.json index.html feed.xml sitemap.xml sw.js; do
            [ -e "$f" ] && git add "$f"
          done
          if git diff --cached --quiet; then
            echo "nothing new to commit"
          else
            git commit -m "write: $(TZ=Australia/Sydney date +%F) issue"
            # Race-safe: the browser writes data/*.json to main via the Contents API at any time, so a
            # mid-run sync would reject a bare push and lose the whole issue. Rebase-and-retry, then
            # fail the step if all attempts lose the race.
            URL="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            pushed=false
            for i in 1 2 3; do
              if git pull --rebase --autostash "$URL" main && git push "$URL" HEAD:main; then
                pushed=true
                break
              fi
              sleep 10
            done
            if [ "$pushed" != "true" ]; then
              echo "push failed after retries (persistent race or rejected update)"
              exit 1
            fi
          fi

      # 5b. Push the updated knowledge graph back to cortex-state (the author + register-concepts
      #     write it; the public repo no longer carries it). Runs after the public Commit so the two
      #     repos can't diverge with an article live whose knowledge update was lost — if THIS push
      #     fails, tomorrow's health check flags the unregistered concepts. Rebase-retry because the
      #     browser can write the state repo at any moment.
      - name: Push knowledge to cortex-state
        if: steps.guard.outputs.skip != 'true'
        run: |
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/cortex_state -o IdentitiesOnly=yes"
          cd "$RUNNER_TEMP/cortex-state"
          cp "$GITHUB_WORKSPACE/data/knowledge.json" data/knowledge.json
          git add data/knowledge.json
          # Archive the day's brief alongside it. It is the only record of WHY a topic was chosen and
          # what facts the author was handed — the Claude steps hide their own output, so without
          # this there is no way to tell a bad article's research apart from its writing. It goes
          # here, not into the public repo, because it quotes the reader's feedback and read history.
          if [ -s "$GITHUB_WORKSPACE/data/brief-today.md" ]; then
            mkdir -p briefs
            cp "$GITHUB_WORKSPACE/data/brief-today.md" "briefs/$(TZ=Australia/Sydney date +%F).md"
            git add briefs
          fi
          if git diff --cached --quiet; then echo "knowledge + brief unchanged"; exit 0; fi
          git config user.name "reading-bot"
          git config user.email "noreply@users.noreply.github.com"
          git commit -m "knowledge + brief: $(TZ=Australia/Sydney date +%F)"
          for i in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            sleep 10
          done
          echo "cortex-state push failed after retries"; exit 1

      # 5c. Scrub the run's private working files before anything is packaged for Pages.
      #     upload-pages-artifact tars the working directory as-is — it has no idea about
      #     .gitignore — so every file materialised earlier in this job (the reader profile, the
      #     state clone, and now the day's brief and digest, which carry read/skip/taste signals)
      #     would otherwise be uploaded to a PUBLIC site. Runs after the cortex-state push, which is
      #     the last step that needs knowledge.json.
      - name: Scrub private runtime files before publish
        if: always() && steps.guard.outputs.skip != 'true'
        run: |
          private="data/profile.local.json data/reading-state.json data/knowledge.json data/corpus.json data/brief-today.md data/digest-today.json"
          rm -f $private
          # One list for both the removal and the check, so they can't drift apart, and one test per
          # path: a single `ls` over the whole set returns non-zero when ANY path is missing, which
          # would make the guard pass at exactly the moment one file survived.
          for f in $private; do
            if [ -e "$f" ]; then echo "! $f survived the scrub — refusing to publish"; exit 1; fi
          done
          # A denylist can't anticipate a file a Claude step invented (data/brief-notes.md,
          # data/research-scratch.md). Anything still UNTRACKED under data/ at this point is not
          # ours to publish — the run's real outputs were committed two steps ago — and a stray
          # holding brief/digest content would be served publicly while the run looked like a quiet
          # skip. Omitting --exclude-standard makes this list ignored files too, in one pass.
          # Deletes rather than exits: failing here would skip the Pages deploy, and a GITHUB_TOKEN
          # push does not trigger deploy.yml, so the day's article would commit but never publish.
          git ls-files --others -- data/ | while read -r f; do
            echo "! removing unexpected file before publish: $f"
            rm -f "$f"
          done
          echo "private runtime files removed from the publish tree"

      # 6. Publish. Gated on the guard too: a skipped catch-up run has nothing new to publish
      #    (the run that wrote today's issue already deployed it).
      - uses: actions/configure-pages@v5
        if: steps.guard.outputs.skip != 'true'
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        if: steps.guard.outputs.skip != 'true'
        with:
          path: "."
      - id: deploy
        if: steps.guard.outputs.skip != 'true'
        uses: actions/deploy-pages@v4

      # 7. Nudge: message the reader that today's issue is live (Telegram). Optional + best-effort:
      #    skips quietly when the secrets aren't set, and never fails a run whose issue already shipped.
      - name: Notify (Telegram)
        if: steps.guard.outputs.skip != 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "telegram secrets not set — skipping nudge"
          else
            node scripts/notify-telegram.mjs "${{ steps.guard.outputs.syd }}" || echo "nudge failed (non-fatal — the issue is already live)"
          fi
