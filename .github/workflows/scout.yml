name: Scout

# Weekly: let Claude (subscription) propose new candidate feeds, validate them, and grow sources.json.
# Cheap + bounded; no deploy needed (sources.json doesn't affect the published site at runtime).
on:
  schedule:
    - cron: "0 19 * * 0" # Sundays 19:00 UTC (~Mon 6am AEST)
  workflow_dispatch: {}

permissions:
  contents: write
  # REQUIRED by anthropics/claude-code-action@v1 — it fetches an OIDC token before invoking
  # Claude. Without it every run dies at "Could not fetch an OIDC token" *before* any tokens
  # are spent, which is exactly how this workflow failed 6/6 silently from 2026-06-28 to
  # 2026-08-09 (green-looking weekly failure emails, sources.json never grew).
  id-token: write

concurrency:
  group: scout
  cancel-in-progress: false

jobs:
  scout:
    runs-on: ubuntu-latest
    # Backstop only. The proposal step is bounded at the STEP level below — a job-level timeout
    # would cancel Validate + Commit and throw away candidates Claude had already written.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Unit tests
        run: node --test scripts/lib/*.test.mjs

      # Materialise the private profile (gitignored) so the scout can tailor proposals to the reader.
      - name: Write reader profile (from secret)
        env:
          READER_PROFILE: ${{ secrets.READER_PROFILE }}
        run: |
          if [ -n "$READER_PROFILE" ]; then printf '%s' "$READER_PROFILE" > data/profile.local.json; fi

      - name: Propose candidate feeds (Claude, subscription)
        # The action fails the step when Claude exceeds --max-turns EVEN IF it finished the job
        # ("Claude reported a successful result after 29 turns, exceeding the configured maximum
        # of 20" — the first real run, 2026-08-09). Without this the candidates it had already
        # written were discarded by the skipped Validate + Commit steps. Same shape as the author
        # step in generate.yml: bound it, then let the deterministic steps salvage the work.
        continue-on-error: true
        timeout-minutes: 8
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: "Read skills/SCOUT.md and follow it exactly: propose new candidate feeds into data/source-candidates.json, then stop."
          # 35, not 20: the first successful run needed 29. Validation is deterministic and free,
          # so the cost of a few extra proposal turns is far below the cost of a wasted weekly run.
          claude_args: "--max-turns 35 --model sonnet --allowedTools Read,Write,Edit,Glob,Grep"

      # Deterministic + free: fetch-tests every proposal and appends only the ones that work.
      # Runs even when the step above was cut short, so partial proposals still land.
      - name: Validate candidates + append the working ones
        run: node scripts/validate-sources.mjs

      - name: Commit grown source list
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "reading-bot"
          git config user.email "noreply@users.noreply.github.com"
          git add data/sources.json data/source-candidates.json
          if git diff --cached --quiet; then
            echo "no new sources this week"
          else
            git commit -m "scout: grow sources $(date -u +%Y-%m-%d)"
            git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main
          fi
